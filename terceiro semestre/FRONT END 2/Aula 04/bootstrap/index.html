<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocaFilm's</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-4">
        <h1 class="text-center">LocaFilm's</h1>
        <p class="text-center text-muted">Aqui você pode alugar filmes que deseja!</p>

        <div class="text-end mb-3">
            <button class="btn btn-primary">
                + Novo Filme
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-bordered align-middle text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Capa</th>
                        <th>Nome</th>
                        <th>Diretor</th>
                        <th>Ano</th>
                        <th>Gênero</th>
                    </tr>
                </thead>
                <tbody id="dados">
                    <tr>
                    <td><img src="image.png" alt="..." class="img-thumbnail"></td>
                    <td>Diário de uma paixão</td>
                    <td>Nick Cassavetes</td>
                    <td>2006</td>
                    <td>romance</td>
                    </tr>
            
                    <tr>
                    <td><img src="derepente30.jpg" alt="..." class="img-thumbnail"></td>
                    <td>De repente 30</td>
                    <td>Gary Winick</td>
                    <td>2004</td>
                    <td>Comedia</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modalFilme" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <form id="formFilme">
                    <div class="modal-header">
                        <h2 class="modal-title">Novo Filme</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">

                        <div class="mb-3">
                            <label class="form-label">Capa (URL)</label>
                            <input type="text" id="capa" name="capa" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" id="nome" name="nome" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Diretor</label>
                            <input type="text" id="diretor" name="diretor" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ano</label>
                            <input type="text" id="ano" name="ano" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Gênero</label>
                            <input type="text" id="genero" name="genero" class="form-control">
                        </div>

                    </div>
                </form>

            </div>
        </div>
    </div>



</body>
</html>
