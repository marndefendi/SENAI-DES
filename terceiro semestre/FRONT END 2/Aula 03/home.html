<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
        <h1>LocaFilm's</h1>
        <h2>Aqui você pode alugar filmes que deseja!</h2>
        <button onclick="abrirModal()">+ Novo Filme</button>

    <main>
        <table>
            <thead>
                <tr>
                    <th>Capa</th>
                    <th>Nome</th>
                    <th>Diretor</th>
                    <th>Ano</th>
                    <th>Genero</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="dados"></tbody>
        </table>
    </main> 
    <div id="modalFilme" class="modal">
        <form id = formFilme class="modal-content">
            <h2>Novo Filme</h2>
            <div id="capa">
            <input type="text" id="capa" name="Capa" placeholder="Cole o link da imagem da capa"></div>
            <input type="text" name="nome" placeholder="Novo">
            <input type="text" name="diretor" placeholder="Diretor">
            <input type="text" name="ano" placeholder="Ano">
            <input type="text" name="genero" placeholder="Genero">
            <div class="modal-buttons">
                <button type="submit">Salvar</button>
                <button type="reset" onclick ="fecharModal()">Cancelar</button>
            </div>
            </form>
    </div>
    
    <script src="script.js"></script>
</body>

</html>
